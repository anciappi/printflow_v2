{% load static %}
<div id="status-block" class="flex items-center gap-3 w-full md:w-auto">
    <div class="px-4 py-2 bg-surface-dark border border-border-default rounded text-center min-w-[140px]">
        <p class="text-[9px] text-slate-500 uppercase font-bold tracking-widest leading-none mb-1">Estado Actual</p>
        <p class="text-xs font-bold text-orange-500">{{ order.get_current_status_display|upper }}</p>
    </div>
    {% with next_statuses=order.get_next_status_display %}
    {% if next_statuses %}
    <button
        hx-post="{% url 'orders:status_update' order.pk %}"
        hx-target="#status-block"
        hx-swap="outerHTML"
        hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
        class="bg-orange-600 hover:bg-orange-500 text-white text-[10px] font-bold py-3 px-4 transition-all uppercase tracking-widest rounded-sm">
        → {{ next_statuses }}
    </button>
    {% endif %}
    {% endwith %}
</div>
