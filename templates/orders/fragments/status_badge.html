{% load static %}
    {% if swap_oob %}
        <div id="status-block" class="flex items-center" hx-swap-oob="true">
    {% else %}
        <div id="status-block" class="flex items-center">
    {% endif %}
    <div class="flex items-center gap-2">
        <div class="w-1.5 h-1.5 rounded-full bg-orange-500 animate-pulse"></div>
        <p class="text-sm font-light text-orange-500 tracking-widest uppercase">{{ order.get_current_status_display }}</p>
    </div>
</div>
{% if swap_oob %}
<span id="info-current-status" hx-swap-oob="true" class="text-sm text-blue-400 font-normal uppercase truncate" title="{{ order.get_current_status_display }}">{{ order.get_current_status_display }}</span>
{% if last_log_quantity %}
<span id="info-current-quantity" hx-swap-oob="true" class="text-sm text-white font-light">{{ last_log_quantity }}</span>
{% endif %}
{% if last_log_material %}
<span id="info-current-material" hx-swap-oob="true" class="text-sm text-white font-light">{{ last_log_material }} <span class="text-[8px] text-slate-500 font-normal">ml</span></span>
{% endif %}
{% endif %}
