{% extends 'base.html' %}

{% block breadcrumbs %} Quotes / Card Job Orders {% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto">

    <div class="flex justify-between items-end mb-6">
        <div>
            <h2 class="text-xl font-bold text-white tracking-tight">Registro de O.T. de Tarjetas</h2>
            <p class="text-xs text-slate-500 mt-1">Gestión técnica y aprobación de trabajos para clientes externos.</p>
        </div>
    </div>

    <!-- Filter Bar -->
    <div id="filter-bar" class="bg-surface border border-border-default p-4 mb-4 rounded-sm">
        <form hx-get="{% url 'quotes:card_job_list' %}" hx-target="#job-table-container" hx-swap="innerHTML" hx-trigger="change, search, keyup changed delay:400ms" class="flex flex-wrap gap-3 items-end">
    
            <!-- Search -->
            <div class="flex-1 min-w-[200px]">
                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Buscar</label>
                <input type="text" name="q" value="{{ current_filters.q }}" placeholder="Cliente, N° orden, descripción..." class="w-full bg-surface-dark border border-border-default text-white text-xs px-3 py-2 focus:border-blue-500 outline-none transition-colors">
            </div>
    
            <!-- Status filter -->
            <div class="min-w-[160px]">
                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Estado</label>
                <select name="status" class="w-full bg-surface-dark border border-border-default text-slate-300 text-xs px-3 py-2 focus:border-blue-500 outline-none">
                    <option value="">Todos</option>
                    {% for value, label in status_choices %}
                    <option value="{{ value }}" {% if current_filters.status == value %}selected{% endif %}>
                        {{ label }}
                    </option>
                    {% endfor %}
                </select>
            </div>
    
            <!-- Branch filter -->
            <div class="min-w-[140px]">
                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Sucursal</label>
                <select name="branch" class="w-full bg-surface-dark border border-border-default text-slate-300 text-xs px-3 py-2 focus:border-blue-500 outline-none">
                    <option value="">Todas</option>
                    {% for branch in branches %}
                    <option value="{{ branch.id }}" {% if current_filters.branch == branch.id|stringformat:"s" %}selected{% endif %}>
                        {{ branch.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>
    
            <!-- Date from -->
            <div class="min-w-[130px]">
                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Desde</label>
                <input type="date" name="date_from" value="{{ current_filters.date_from }}" class="w-full bg-surface-dark border border-border-default text-slate-300 text-xs px-3 py-2 focus:border-blue-500 outline-none">
            </div>
    
            <!-- Date to -->
            <div class="min-w-[130px]">
                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Hasta</label>
                <input type="date" name="date_to" value="{{ current_filters.date_to }}" class="w-full bg-surface-dark border border-border-default text-slate-300 text-xs px-3 py-2 focus:border-blue-500 outline-none">
            </div>
    
        </form>
    </div>

    <div id="job-table-container" class="bg-surface border border-border-default overflow-hidden shadow-2xl rounded-sm">
        {% include 'quotes/fragments/job_table.html' %}
    </div>
</div>
{% endblock %}
