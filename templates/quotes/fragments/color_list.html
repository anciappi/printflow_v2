{% load static %}
<div id="color-list-{{ side|lower }}">
  {% for color in job.colors.all %}
    {% if color.side == side %}
    <div class="flex items-center gap-3 bg-surface-dark border border-border-default px-4 py-2 rounded-sm mb-2 group">
      <!-- Color dot -->
      <span class="w-3 h-3 rounded-full flex-shrink-0 border border-white/10" style="background-color: {{ color.pantone.hex_value|default:'#ccc' }}"></span>
      <!-- Color name -->
      <span class="text-sm text-slate-300 flex-1">{{ color.pantone.code }}</span>
      <!-- Category badge -->
      <span class="text-[9px] text-slate-600 uppercase tracking-widest">{{ color.pantone.category }}</span>
      <!-- Remove button -->
      <button type="button" hx-post="{% url 'quotes:card_job_color_remove' job.pk color.pk %}" hx-target="#color-list-{{ side|lower }}" hx-swap="outerHTML" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}' class="text-slate-600 hover:text-red-500 transition-colors opacity-0 group-hover:opacity-100">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
    {% endif %}
  {% empty %}
  <p class="text-xs text-slate-600 italic py-2">Sin tintas registradas.</p>
  {% endfor %}
</div>
