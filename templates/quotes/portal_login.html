{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | PrintFlow Client Portal</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/portal.css' %}">
</head>

<body class="min-h-screen flex items-center justify-center p-4 antialiased">

    <div class="w-full max-w-sm">
        <!-- Brand Header -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-white tracking-widest uppercase">PrintFlow</h1>
            <p class="text-slate-500 text-[10px] font-bold uppercase tracking-[0.2em] mt-1">Client Portal</p>
        </div>

        <!-- Login Card -->
        <div class="bg-surface border border-border-default rounded-sm p-8 shadow-2xl">
            <div class="mb-8">
                <h2 class="text-lg font-bold text-white">Acceso para clientes</h2>
                <p class="text-slate-400 text-xs mt-1">Ingrese sus credenciales para continuar.</p>
            </div>

            {% if form.errors %}
            <div class="mb-6 p-3 rounded-sm bg-red-500/10 border border-red-500/20 text-red-500 text-xs">
                Usuario o contraseña incorrectos.
            </div>
            {% endif %}

            <form method="post" class="space-y-5">
                {% csrf_token %}

                <div>
                    <label for="id_username"
                        class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2 block">Usuario</label>
                    <input type="text" name="username" id="id_username" required
                        class="w-full px-4 py-2 bg-surface-dark border border-border-default rounded-sm text-white text-sm outline-none focus:border-blue-400 transition-colors"
                        placeholder="nombre.apellido">
                </div>

                <div>
                    <label for="id_password"
                        class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2 block">Contraseña</label>
                    <input type="password" name="password" id="id_password" required
                        class="w-full px-4 py-2 bg-surface-dark border border-border-default rounded-sm text-white text-sm outline-none focus:border-blue-400 transition-colors"
                        placeholder="••••••••">
                </div>

                <div class="pt-2">
                    <button type="submit"
                        class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold uppercase tracking-widest rounded-sm transition-all">
                        Ingresar al Portal
                    </button>
                </div>
            </form>
        </div>

        <!-- Footer -->
        <div class="mt-8 text-center text-slate-500 text-[10px] uppercase tracking-widest">
            &copy; 2026 PrintFlow v2
        </div>
    </div>

</body>

</html>
