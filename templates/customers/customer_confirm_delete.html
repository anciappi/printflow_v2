{% extends "base.html" %}

{% block breadcrumbs %} Ventas / Eliminar Cliente {% endblock %}

{% block content %}
<div class="max-w-xl mx-auto mt-12">
    <div class="bg-surface border border-border-default rounded-lg p-8 text-center shadow-2xl">
        <div class="mb-6">
            <div class="w-16 h-16 bg-red-900/20 border border-red-900/40 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z">
                    </path>
                </svg>
            </div>
            <h2 class="text-xl font-bold text-white uppercase tracking-wider">¿Eliminar Cliente?</h2>
            <p class="text-slate-400 mt-2 text-sm">
                Estás por eliminar a <span class="text-white font-bold">{{ object.name }}</span>.<br>
                Esta acción es permanente y no se puede deshacer.
            </p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="flex flex-col sm:flex-row gap-3 justify-center">
                <a href="{% url 'customers:list' %}" class="px-6 py-2 bg-surface-dark hover:bg-surface-mid border border-border-default text-slate-300 rounded font-medium transition-colors text-sm">
                    Cancelar
                </a>
                <button type="submit" class="px-6 py-2 bg-red-600 hover:bg-red-500 text-white rounded font-medium transition-colors text-sm shadow-lg shadow-red-900/20">
                    Sí, Eliminar Cliente
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
