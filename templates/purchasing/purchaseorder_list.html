{% extends 'base.html' %}

{% block breadcrumbs %} Purchasing / Purchase Orders {% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto pb-10">

    <!-- HEADER -->
    <div class="mb-6 border-b border-border-default pb-4 flex justify-between items-end">
        <div>
            <h2 class="text-xl font-bold text-white tracking-tight">Órdenes de Compra</h2>
            <p class="text-xs text-slate-500 mt-1">Gestión de compras de insumos y materia prima.</p>
        </div>
        <a href="{% url 'purchasing:oc_create' %}" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-2 px-5 rounded-sm shadow-lg shadow-emerald-900/20 transition-all uppercase tracking-wider">
            + Nueva Orden
        </a>
    </div>

    <div hx-get="{% url 'purchasing:oc_list' %}" hx-trigger="ocUpdated from:body" hx-swap="innerHTML">
        {% include 'purchasing/fragments/oc_table.html' %}
    </div>
</div>

<div id="modal-container"></div>
{% endblock %}
