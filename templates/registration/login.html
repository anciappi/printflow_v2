{% load static %}
<!DOCTYPE html>
<html lang="es" class="h-full bg-surface-dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | PrintFlow v2</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body class="h-full flex items-center justify-center p-6 text-slate-300 antialiased font-sans">

    <div class="w-full max-w-sm">
        <!-- Logo / Marca -->
        <div class="text-center mb-10">
            <h1 class="text-3xl font-bold text-white tracking-tighter">
                PRINTFLOW <span class="text-blue-500">v2</span>
            </h1>
            <p class="text-xs uppercase tracking-[0.3em] text-slate-500 mt-2">Gestión de Imprenta</p>
        </div>

        <!-- Caja de Login (Estética VS Code) -->
        <div class="bg-surface border border-border-default p-8 shadow-2xl">
            <form method="post" class="space-y-6">
                {% csrf_token %}
                
                {% if form.errors %}
                <div class="bg-red-900/20 border border-red-900/50 text-red-400 text-xs p-3 mb-4">
                    Usuario o contraseña incorrectos.
                </div>
                {% endif %}

                <div>
                    <label for="username" class="block text-xs font-medium uppercase tracking-wider text-slate-500 mb-2">Usuario</label>
                    <input type="text" name="username" id="username" required class="w-full bg-surface-dark border border-border-default text-slate-200 px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500 transition-colors" placeholder="admin">
                </div>

                <div>
                    <label for="password" class="block text-xs font-medium uppercase tracking-wider text-slate-500 mb-2">Contraseña</label>
                    <input type="password" name="password" id="password" required class="w-full bg-surface-dark border border-border-default text-slate-200 px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500 transition-colors" placeholder="••••••••">
                </div>

                <div class="pt-2">
                    <button type="submit"  class="w-full bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold py-3 transition-colors duration-200">
                        INGRESAR
                    </button>
                </div>
            </form>
        </div>

        <!-- Footer del Login -->
        <p class="text-center text-[10px] text-slate-600 mt-8 uppercase tracking-widest">
            &copy; 2024 Desarrollado por PrintFlow Team
        </p>
    </div>

</body>
</html>
