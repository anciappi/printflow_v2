{% extends 'base.html' %}

{% block breadcrumbs %} Inventory / Configuración / Borrar Material {% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-10">
    <div class="bg-surface border border-red-900/50 shadow-2xl overflow-hidden text-center p-8">
        
        <div class="mb-4 text-red-500 flex justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
        </div>

        <h2 class="text-xl font-bold text-white mb-2">¿Eliminar Material?</h2>
        <p class="text-sm text-slate-400 mb-6">
            Estás a punto de borrar <strong>"{{ object.name }}"</strong> del sistema. <br>
            Esta acción no se puede deshacer.
        </p>

        <form method="POST">
            {% csrf_token %}
            <div class="flex justify-center gap-4">
                <a href="{% url 'inventory:material_list' %}" class="px-6 py-2.5 text-xs font-bold text-slate-500 hover:text-white bg-surface-hover hover:bg-slate-700 transition-colors uppercase tracking-wider rounded">
                    Cancelar
                </a>
                <button type="submit" class="bg-red-600 hover:bg-red-500 text-white text-xs font-bold py-2.5 px-6 shadow-lg shadow-red-900/20 transition-all uppercase tracking-wider rounded">
                    Sí, Eliminar
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
